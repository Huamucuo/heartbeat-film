<main><h1>心跳 · 源码预览</h1><p>按当前源码实时绘制。<a href="index.html">观看原成片</a> · <a href="docs/REPRODUCE.md">复现说明</a></p><canvas id="film"></canvas><section><button id="play">播放</button><input id="seek" type="range" min="0" max="161.69" step="0.01" value="0" aria-label="播放位置"><output id="time">0.00 / 161.70 s</output></section><audio id="audio" src="audio/generated/master.wav" preload="metadata"></audio></main>
<script type="module">import './src/film.mjs';const a=document.querySelector('#audio'),s=document.querySelector('#seek'),b=document.querySelector('#play'),o=document.querySelector('#time');b.onclick=async()=>{if(a.paused){try{await a.play()}catch(e){o.textContent='请先还原运行素材：'+e.message}}else a.pause()};s.oninput=()=>{a.currentTime=+s.value;window.heartbeat.frame(+s.value)};function tick(){if(!a.paused){s.value=a.currentTime;window.heartbeat.frame(a.currentTime)}o.textContent=(+s.value).toFixed(2)+' / 161.70 s';b.textContent=a.paused?'播放':'暂停';requestAnimationFrame(tick)}tick();</script></html>
